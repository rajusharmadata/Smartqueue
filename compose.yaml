  version: '3.9'

  services:

    postgres:
      image: postgres:17
      container_name: smartqueue-postgres

      environment:
        POSTGRES_DB: smartqueue
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

    redis:
      image: redis:7
      container_name: smartqueue-redis

      ports:
        - "6379:6379"

    smartqueue:
      build: .

      container_name: smartqueue-service

      depends_on:
        - postgres
        - redis

      ports:
        - "8080:8080"

      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartqueue
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

        SPRING_DATA_REDIS_HOST: redis
        SPRING_DATA_REDIS_PORT: 6379

  volumes:
    postgres_data:

